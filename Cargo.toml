[workspace]
resolver = "2"
members = [
    "crates/v9r-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["v9r contributors"]

[workspace.dependencies]
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "sync", "io-util", "io-std", "time", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
libc = "0.2"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
